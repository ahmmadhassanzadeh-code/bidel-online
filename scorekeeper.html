<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d2818"><title>بیدل — امتیازنویس</title><style>
:root{--bg:#0d2818;--gold:#ffd700;--red:#ff5252;--grn:#81c784}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:Tahoma,sans-serif;background:linear-gradient(135deg,#0d2818,#1a472a) fixed;color:#fff;margin:0;padding:12px 12px 80px;min-height:100vh}.wrap{max-width:560px;margin:auto}h1{text-align:center;color:var(--gold);font-size:22px;margin:4px 0 12px}.box{background:rgba(0,0,0,.24);border-radius:14px;padding:14px;margin-bottom:12px}.t{font-weight:bold;color:var(--gold);text-align:center;margin-bottom:10px}button{font-family:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:bold;background:var(--gold);color:#1a472a;margin:3px}button:disabled{opacity:.4}button.s{background:rgba(255,255,255,.14);color:#fff}button.r{background:#c62828;color:#fff}button.sm{padding:5px 9px;font-size:12px}input,select{font-family:inherit;font-size:16px;color:#fff;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:8px}.num{width:64px;text-align:center}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.pc{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 14px;margin:5px 0;display:flex;justify-content:space-between;align-items:center}.pc .tot{font-size:26px;font-weight:bold;color:var(--gold);min-width:50px;text-align:center}.hr{background:rgba(0,0,0,.2);border-radius:10px;padding:8px 10px;margin:4px 0;display:flex;align-items:center;gap:4px;font-size:13px}.hr span.c{flex:1;text-align:center}.msg{color:var(--red);text-align:center;font-size:13px;min-height:18px;margin-top:6px}.ban{border-radius:12px;padding:10px;text-align:center;font-weight:bold;margin-bottom:12px;font-size:14px}.ban.w{background:linear-gradient(90deg,#ffd700,#ffea00);color:#1a472a}.ban.b{background:#1e88e5}.ban.g{background:#43a047}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid rgba(255,255,255,.18);padding:7px 3px;text-align:center}th{background:rgba(255,215,0,.15);color:var(--gold)}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#08190f;border-top:1px solid rgba(255,215,0,.3);padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;margin:0;border-radius:0;background:none;color:#fff;opacity:.6;padding:12px 4px}nav button.on{opacity:1;color:var(--gold)}.hide{display:none!important}.md{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}.md>div{background:#1a472a;border:2px solid var(--gold);border-radius:16px;padding:20px;max-width:380px;width:100%;text-align:center;line-height:1.9}#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#000d;border:1px solid var(--gold);padding:8px 16px;border-radius:20px;display:none;z-index:20;font-size:13px}.empty{text-align:center;opacity:.6;padding:14px}
</style></head><body><div class="wrap"><h1>♥ بیدل — امتیازنویس ♠</h1>
<section id="v-play"><div class="box" id="setup"><div class="t">👤 نام ۴ بازیکن</div><div id="names" style="display:flex;flex-direction:column;gap:8px;align-items:center"></div><div class="row" style="justify-content:center;margin-top:12px">امتیاز پایان: <select id="target"><option>50</option><option selected>100</option><option>150</option><option>200</option></select></div><div style="text-align:center;margin-top:10px"><button onclick="start()">🎮 شروع بازی</button></div></div>
<div id="game" class="hide"><div id="banner"></div><div id="plist"></div><div class="box" id="entry"><div class="t" id="etitle">➕ ثبت دور جدید</div><div id="ein" style="display:flex;flex-direction:column;gap:8px"></div><div class="row" style="justify-content:center;margin:10px 0"><label><input type="checkbox" id="mchk" onchange="moonT()"> 🌙 Moon</label><select id="msel" class="hide" onchange="moonS()"></select></div><div style="text-align:center"><button id="sbtn" onclick="saveRound()">💾 ثبت دور</button><button id="cbtn" class="s hide" onclick="cancelEdit()">لغو</button></div><div class="msg" id="msg"></div></div><div class="box" style="border:1px solid rgba(255,82,82,.35)"><div class="t" style="color:var(--red)">⚠️ جریمه اضافی (۱ تا ۲۶)</div><div class="row" style="justify-content:center;flex-wrap:wrap"><select id="pp"></select><input type="number" id="pa" class="num" min="1" max="26" placeholder="۱–۲۶"><button class="r" onclick="addPen()">ثبت</button></div></div><div class="row"><b style="color:var(--gold)">📜 تاریخچه دورها</b><span><button class="s sm" onclick="shareNow()">📤 اشتراک</button><button class="s sm" onclick="askNew()">🔄 بازی جدید</button></span></div><div id="hist"></div></div></section>
<section id="v-stats" class="hide"><div class="box"><div class="t">🏆 آمار کلی مشترک بیدل</div><div id="sb"></div><p style="font-size:11px;opacity:.65">این آمار با نتایج بازی آنلاین بیدل مشترک است.</p><button onclick="renderStats()">🔄 تازه‌سازی</button></div></section><section id="v-log" class="hide"><div class="box"><div class="t">🗂 بازی‌های قبلی این گوشی</div><div id="glog"></div></div></section></div>
<nav><button id="t-play" class="on" onclick="tab('play')">🎴<br>بازی</button><button id="t-stats" onclick="tab('stats')">🏆<br>آمار</button><button id="t-log" onclick="tab('log')">🗂<br>قبلی‌ها</button></nav><div class="md" id="md"><div id="mc"></div></div><div id="toast"></div>
<script>
const $=id=>document.getElementById(id),E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api='/api/stats/record',newId=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12),newGame=n=>({id:newId(),names:n,rounds:[],pens:[],phase:'play',over:false,started:false,target:100});
function load(){try{const d=JSON.parse(localStorage.getItem('bidel_real_v1'));if(d&&d.cur)return d}catch(e){}return{cur:newGame(['بازیکن ۱','بازیکن ۲','بازیکن ۳','بازیکن ۴']),games:[]}}
let D=load(),vals=['','','',''],autoI=-1,moonOn=false,moon='',edit=-1;const G=()=>D.cur;
function save(){try{localStorage.setItem('bidel_real_v1',JSON.stringify(D))}catch(e){toast('حافظه گوشی پر است')}}function toast(m){$('toast').textContent=m;$('toast').style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>$('toast').style.display='none',2500)}
function ask(m,yes){$('mc').innerHTML='<p>'+m+'</p><button class="r" id="yes">بله</button><button class="s" onclick="closeM()">نه</button>';$('yes').onclick=()=>{closeM();yes()};$('md').style.display='flex'}function info(m){$('mc').innerHTML=m+'<br><button onclick="closeM()">باشه</button>';$('md').style.display='flex'}function closeM(){$('md').style.display='none'}
function totals(g=G()){const t=[0,0,0,0];g.rounds.forEach(r=>r.s.forEach((v,i)=>t[i]+=v));g.pens.forEach(p=>t[p.p]+=p.a);return t}function ext(t){const mn=Math.min(...t),mx=Math.max(...t);return{mn,mx,f:t.map((v,i)=>v===mn?i:-1).filter(i=>i>=0),l:t.map((v,i)=>v===mx?i:-1).filter(i=>i>=0)}}
async function reportResult(){const g=G(),t=totals(),x=ext(t),w=x.f[0],l=x.l[0],moons=[];g.rounds.forEach(r=>{if(r.m!==null)moons.push(r.m)});try{const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventId:'real:'+g.id,names:g.names,winner:w,loser:l,moons,source:'real'})});if(!r.ok)throw 0;toast('نتیجه در آمار کلی بیدل ثبت شد ✅')}catch(e){toast('نتیجه محلی ذخیره شد؛ همگام‌سازی آمار انجام نشد')}}
function finish(){const g=G(),t=totals(),x=ext(t),w=x.f[0],l=x.l[0];g.over=true;D.games.unshift({id:g.id,d:Date.now(),names:g.names.slice(),t,w,l,n:g.rounds.length,moons:g.rounds.filter(r=>r.m!==null).map(r=>g.names[r.m])});D.games=D.games.slice(0,200);save();reportResult();info('<b style="color:var(--gold)">🏁 بازی تمام شد!</b><br>🏆 '+E(g.names[w])+' ('+t[w]+')<br>💔 '+E(g.names[l])+' ('+t[l]+')')}
function evaluate(after){const g=G();if(g.over)return;const t=totals(),x=ext(t),uniq=x.f.length===1&&x.l.length===1;if(g.phase==='tie'){if(uniq)finish();return}if(g.phase==='extra'){if(!after)return;if(uniq)finish();else g.phase='tie';return}const over=t.filter(v=>v>=g.target).length;if(over===1){if(uniq)finish();else g.phase='tie'}else if(over>=2){g.phase='extra';info('چند نفر از امتیاز پایان عبور کردند؛ یک دور دیگر بازی کنید.')}}
function drawNames(){const g=G();$('names').innerHTML=g.names.map((n,i)=>'<input id="n'+i+'" maxlength="24" value="'+E(n)+'" placeholder="بازیکن '+(i+1)+'" style="width:220px;text-align:right">').join('');$('target').value=g.target}
function start(){const g=G();g.names=Array.from({length:4},(_,i)=>$('n'+i).value.trim()||'بازیکن '+(i+1));if(new Set(g.names).size<4){toast('نام‌ها باید متفاوت باشند');return}g.target=+$('target').value;g.started=true;save();render()}
function buildEntry(){const g=G();$('ein').innerHTML=g.names.map((n,i)=>'<div class="row"><b style="flex:1">'+E(n)+'</b><button class="s sm" onclick="step('+i+',-1)">−</button><input type="number" class="num" id="in'+i+'" min="0" max="26" placeholder="0" oninput="setV('+i+',this.value)"><button class="s sm" onclick="step('+i+',1)">＋</button></div>').join('');$('msel').innerHTML='<option value="">کی Moon زد؟</option>'+g.names.map((n,i)=>'<option value="'+i+'">'+E(n)+'</option>').join('');$('pp').innerHTML='<option value="">بازیکن…</option>'+g.names.map((n,i)=>'<option value="'+i+'">'+E(n)+'</option>').join('')}
function setV(i,v){if(autoI>=0&&autoI!==i){vals[autoI]='';autoI=-1}if(autoI===i)autoI=-1;v=v===''?'':Math.max(0,Math.min(26,Math.floor(+v)));vals[i]=v;const f=vals.filter(x=>x!=='');if(f.length===3){const s=vals.reduce((a,x)=>a+(x===''?0:+x),0),e=vals.findIndex(x=>x==='');if(s<=26){vals[e]=26-s;autoI=e}}refreshEntry()}
function step(i,d){if(moonOn)return;setV(i,Math.max(0,Math.min(26,(+vals[i]||0)+d)))}function moonT(){moonOn=$('mchk').checked;$('msel').classList.toggle('hide',!moonOn);if(!moonOn){moon='';$('msel').value=''}applyMoon()}function moonS(){moon=$('msel').value;applyMoon()}function applyMoon(){autoI=-1;if(moonOn&&moon!=='')vals=vals.map((_,i)=>i==moon?0:26);else vals=['','','',''];refreshEntry()}
function check(){if(moonOn)return moon===''?{ok:0,msg:'بازیکن Moon را انتخاب کن'}:{ok:1,msg:''};if(vals.some(v=>v===''))return{ok:0,msg:''};const s=vals.reduce((a,v)=>a+ +v,0);return s===26?{ok:1,msg:''}:{ok:0,msg:'مجموع باید ۲۶ باشد (الان '+s+')'}}function refreshEntry(){for(let i=0;i<4;i++){const e=$('in'+i);if(e){e.value=vals[i];e.disabled=moonOn&&moon!==''}}const c=check();$('msg').textContent=c.msg;$('sbtn').disabled=!c.ok}
function resetEntry(){vals=['','','',''];autoI=-1;moonOn=false;moon='';edit=-1;$('mchk').checked=false;$('msel').classList.add('hide');$('msel').value='';$('etitle').textContent='➕ ثبت دور جدید';$('sbtn').textContent='💾 ثبت دور';$('cbtn').classList.add('hide');refreshEntry()}
function saveRound(){const g=G();if(g.over||!check().ok)return;const r={s:vals.map(Number),m:moonOn?+moon:null};if(edit>=0){g.rounds[edit]=r;g.phase='play';resetEntry();save();render();evaluate(false)}else{g.rounds.push(r);resetEntry();evaluate(true)}save();render()}
function editRound(i){const g=G(),r=g.rounds[i];edit=i;vals=r.s.slice();moonOn=r.m!==null;moon=r.m===null?'':r.m;$('mchk').checked=moonOn;$('msel').classList.toggle('hide',!moonOn);$('msel').value=moon;$('etitle').textContent='ویرایش دور '+(i+1);$('sbtn').textContent='ذخیره';$('cbtn').classList.remove('hide');refreshEntry()}function cancelEdit(){resetEntry()}
function delRound(i){ask('این دور حذف شود؟',()=>{G().rounds.splice(i,1);G().phase='play';resetEntry();evaluate(false);save();render()})}function addPen(){const p=$('pp').value,a=+$('pa').value;if(p===''||!Number.isInteger(a)||a<1||a>26){toast('بازیکن و جریمه ۱ تا ۲۶ را انتخاب کن');return}G().pens.push({p:+p,a});$('pp').value='';$('pa').value='';evaluate(false);save();render()}function delPen(i){ask('جریمه حذف شود؟',()=>{G().pens.splice(i,1);G().phase='play';evaluate(false);save();render()})}
function render(){const g=G();$('setup').classList.toggle('hide',g.started);$('game').classList.toggle('hide',!g.started);if(!g.started){drawNames();renderStats();renderLog();return}const t=totals(),x=ext(t),has=g.rounds.length+g.pens.length>0;$('plist').innerHTML=g.names.map((n,i)=>'<div class="pc"><b>'+E(n)+' '+(has&&t[i]===x.mn?'🏆':'')+(has&&t[i]===x.mx?'💔':'')+'</b><span class="tot">'+t[i]+'</span></div>').join('');let b='';if(g.over)b='<div class="ban g">🏁 بازی تمام شده — بازی جدید را بزن</div>';else if(g.phase==='tie')b='<div class="ban b">⚖️ اول یا آخر مشخص نیست؛ یک دور دیگر</div>';else if(g.phase==='extra')b='<div class="ban b">⏳ چند نفر از امتیاز پایان عبور کردند؛ یک دور دیگر</div>';else if(has)b='<div class="ban w">🏆 '+x.f.map(i=>E(g.names[i])).join(' و ')+' پیشتاز · 💔 '+x.l.map(i=>E(g.names[i])).join(' و ')+'</div>';$('banner').innerHTML=b;$('entry').style.opacity=g.over?.4:1;$('entry').style.pointerEvents=g.over?'none':'auto';let h='<div class="hr" style="opacity:.6">دور'+g.names.map(n=>'<span class="c">'+E(n)+'</span>').join('')+'<span></span></div>';g.pens.forEach((p,i)=>h+='<div class="hr"><span>⚠️</span><span class="c">'+E(g.names[p.p])+' +'+p.a+'</span><button class="r sm" onclick="delPen('+i+')">🗑</button></div>');for(let i=g.rounds.length-1;i>=0;i--){const r=g.rounds[i];h+='<div class="hr"><span>'+(i+1)+'</span>'+r.s.map((v,k)=>'<span class="c">'+v+(r.m===k?'🌙':'')+'</span>').join('')+'<button class="s sm" onclick="editRound('+i+')">✏️</button><button class="r sm" onclick="delRound('+i+')">🗑</button></div>'}$('hist').innerHTML=has?h:'<div class="empty">هنوز دوری ثبت نشده</div>';buildEntry();refreshEntry();renderStats();renderLog()}
async function renderStats(){const el=$('sb');el.innerHTML='در حال دریافت آمار آنلاین…';try{const r=await fetch('/api/stats',{cache:'no-store'});const d=await r.json(),rows=Object.entries(d.players||{}).sort((a,b)=>b[1].wins-a[1].wins);el.innerHTML=rows.length?'<table><tr><th>بازیکن</th><th>بازی</th><th>برد</th><th>باخت</th><th>Moon</th></tr>'+rows.map(([n,x])=>'<tr><td>'+E(n)+'</td><td>'+x.games+'</td><td>'+x.wins+'</td><td>'+x.losses+'</td><td>'+x.moons+'</td></tr>').join('')+'</table>':'هنوز آماری ثبت نشده'}catch(e){el.textContent='آمار آنلاین فعلاً در دسترس نیست'}}
function renderLog(){$('glog').innerHTML=D.games.length?D.games.map(x=>'<div class="hr" style="display:block">'+new Date(x.d).toLocaleString('fa-IR')+' · 🏆 '+E(x.names[x.w])+' ('+x.t[x.w]+') · 💔 '+E(x.names[x.l])+' ('+x.t[x.l]+')</div>').join(''):'<div class="empty">هنوز بازی کاملی ثبت نشده</div>'}
function askNew(){ask('دورها و جریمه‌ها پاک شوند و بازی جدید شروع شود؟',()=>{const old=G();D.cur=newGame(old.names);D.cur.target=old.target;save();render()})}function tab(n){['play','stats','log'].forEach(k=>{$('v-'+k).classList.toggle('hide',k!==n);$('t-'+k).classList.toggle('on',k===n)});if(n==='stats')renderStats()}
async function shareNow(){const g=G(),t=totals(),txt='♥ بیدل ♠\n'+g.names.map((n,i)=>n+': '+t[i]).join('\n');try{if(navigator.share)await navigator.share({text:txt});else{await navigator.clipboard.writeText(txt);toast('کپی شد')}}catch(e){toast('اشتراک‌گذاری انجام نشد')}}
$('md').onclick=e=>{if(e.target===$('md'))closeM()};render();
</script></body></html>
